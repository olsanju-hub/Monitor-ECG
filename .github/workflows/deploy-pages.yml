name: Publicar ECG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "ecg-pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Verificar ritmos y tiempos del ECG
        run: node --test tests/ecg-engine.test.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
